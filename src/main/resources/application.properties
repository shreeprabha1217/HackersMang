spring.application.name=ai-code-review-demo

# In-memory H2 database, reset on every restart — fine for a live demo.
spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

# Turn these on during the N+1 demo so the query flood is visible in the console.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true

# Quiets Hibernate's own noisy logging so your SQL is what stands out on screen.
logging.level.org.hibernate.stat=off
logging.level.org.springframework.web=info
